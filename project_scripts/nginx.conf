server {
    listen 80 default_server;
    server_name _;

    root  /var/www/fdfs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/movies {
        proxy_pass http://fdfs-movies.srinun.in:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/bookings {
        proxy_pass http://fdfs-booking.srinun.in:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/notifications {
        proxy_pass http://fdfs-notification.srinun.in:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
    }
}