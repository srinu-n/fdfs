- name: writing the playbook for the movie svc
  hosts: all
  connection: local
  become: true
  tasks:
    - name: installing the dependencies reuqired for movie svc[python3 python3-venv python3-pip unzip curl postgresql-client]
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
      - python3 
      - python3-venv 
      - python3-pip 
      - unzip 
      - curl 
      - postgresql-client
      - python3-psycopg2

    - name: creating the system user to run the fdfs app
      ansible.builtin.user:
        create_home: false
        name: fdfs
        shell: /usr/sbin/nologin
        state: present
        system: true

    - name: create the service folder
      ansible.builtin.file:
        path: /opt/fdfs/movie-service
        state: directory

    
    - name: download the source code
      ansible.builtin.get_url:
        url: https://fdfs-artifacts-30b67175.s3.amazonaws.com/movie-service-v1.zip
        dest: /tmp/movie-service.zip

    - name: un-archive the downloaded code
      ansible.builtin.unarchive:
        remote_src: yes
        dest: /opt/fdfs/movie-service 
        src: /tmp/movie-service.zip
    
    - name: installing the requirements.txt for the movie svc
      ansible.builtin.pip:
        virtualenv: /opt/fdfs/movie-service/venv
        virtualenv_command: python3 -m venv
        requirements: /opt/fdfs/movie-service/requirements.txt
    
    - name: change the owner for the movies svc
      ansible.builtin.file:
        owner: fdfs
        path: /opt/fdfs/movie-service
        recurse: yes
        state: directory
    
    
    - name: create the directory first for copying the env file
      ansible.builtin.file:
        path: /etc/fdfs
        state: directory

    - name: copy the env file
      ansible.builtin.copy:
        src: movie_svc_v1_env.file
        dest: /etc/fdfs/movie-service.env
        mode: '0600'


    - name: Check whether the movies table already exists
      community.postgresql.postgresql_query:
        login_db: fdfs
        login_host: localhost
        login_password: FdfsPass123
        login_user: fdfs
        query: "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'movies'"
      register: movies_table

    - name: Show what the check returned
      ansible.builtin.debug:
        var: movies_table

    - name: Load the database schema (only if the movies table is missing)
      community.postgresql.postgresql_db:
        login_host: localhost
        login_password: FdfsPass123
        login_user: fdfs
        name: fdfs
        state: restore
        target: /opt/fdfs/movie-service/db/schema.sql
      when: movies_table.rowcount == 0

    - name: Count the movies already in the table
      community.postgresql.postgresql_query:
        login_db: fdfs
        login_host: localhost
        login_password: FdfsPass123
        login_user: fdfs
        query: "SELECT count(*) AS total FROM movies"
      register: movie_rows

    
    - name: Show what the check returned
      ansible.builtin.debug:
        var: movie_rows


    - name: Load the sample movies (only if the table is empty)
      community.postgresql.postgresql_db:
        login_host: localhost
        login_password: FdfsPass123
        login_user: fdfs
        name: fdfs
        state: restore
        target: /opt/fdfs/movie-service/db/seed.sql
      when: movie_rows.query_result[0].total == 0



    - name: copy the service file
      ansible.builtin.copy:
        src: movie_svc_v1_service.file
        dest: /etc/systemd/system/fdfs-movie-service.service
    
    - name: daemon reload and enable the service
      ansible.builtin.systemd_service:
        daemon_reload: true
        enabled: true
        name: fdfs-movie-service
        state: restarted





        


      

      