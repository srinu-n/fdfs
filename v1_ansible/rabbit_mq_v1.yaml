- name: Install and configure RabbitMQ for FDFS
  hosts: all
  become: true
  connection: local
  tasks:
    - name: Update the apt cache and install rabbitmq-server
      ansible.builtin.apt:
        name: rabbitmq-server
        state: present
        update_cache: true


    - name: just enable the raabitmq to restart on boot
      ansible.builtin.systemd_service:
        name: rabbitmq-server
        enabled: true
      
    
    - name: creating and updating the permissions of the rabbitmq user
      community.rabbitmq.rabbitmq_user:
        user: fdfs
        state: present
        permissions:
          - vhost: /
            configure_priv: .*
            read_priv: .*
            write_priv: .*
        password: FdfsPass123
        tags: administrator


    - name: enable the rabbitmq admin ui
      community.rabbitmq.rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled