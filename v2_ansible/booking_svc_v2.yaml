- name: Install and run the FDFS booking service
  hosts: all
  connection: local
  become: true
  vars_files:
    - secrets.yaml
  tasks:
    - name: Install system packages for the booking service (Python, venv, pip, unzip, curl, PostgreSQL client, psycopg2)
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
      - python3 
      - python3-venv 
      - python3-pip 
      - unzip 
      - curl 
      - postgresql-client
      - python3-psycopg2

    - name: Create the fdfs system user to run the service
      ansible.builtin.user:
        create_home: false
        name: fdfs
        shell: /usr/sbin/nologin
        state: present
        system: true

    - name: Create the booking service folder
      ansible.builtin.file:
        path: /opt/fdfs/booking-service
        state: directory

    
    - name: Download the booking service release (v1)
      ansible.builtin.get_url:
        url: https://fdfs-artifacts-30b67175.s3.amazonaws.com/booking-service-v1.zip
        dest: /tmp/booking-service.zip

    - name: Extract the booking service code (owned by fdfs)
      ansible.builtin.unarchive:
        remote_src: yes
        dest: /opt/fdfs/booking-service 
        src: /tmp/booking-service.zip
        owner: fdfs
        group: fdfs
      notify: start the booking svc
    
    - name: Create the virtualenv and install the Python requirements
      ansible.builtin.pip:
        virtualenv: /opt/fdfs/booking-service/venv
        virtualenv_command: python3 -m venv
        requirements: /opt/fdfs/booking-service/requirements.txt
      notify: start the booking svc
    
    - name: Make fdfs the owner of the booking service folder
      ansible.builtin.file:
        owner: fdfs
        path: /opt/fdfs/booking-service
        recurse: yes
        state: directory
    
    
    - name: Create the /etc/fdfs config folder
      ansible.builtin.file:
        path: /etc/fdfs
        state: directory

    - name: Copy the booking service env file
      ansible.builtin.file:
        src: booking_svc_v2_env.j2
        dest: /etc/fdfs/booking-service.env
        mode: '0600'
      notify: start the booking svc


    - name: Check whether the bookings table already exists
      community.postgresql.postgresql_query:
        login_db: fdfs
        login_host: localhost
        login_password: FdfsPass123
        login_user: fdfs
        query: "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'bookings'"
      register: bookings_table
      notify: start the booking svc

    - name: Load the booking schema (only if the bookings table is missing)
      community.postgresql.postgresql_db:
        login_host: localhost
        login_password: FdfsPass123
        login_user: fdfs
        name: fdfs
        state: restore
        target: /opt/fdfs/booking-service/db/schema.sql
      when: bookings_table.rowcount == 0
      notify: start the booking svc

    - name: Install the systemd unit file for the booking service
      ansible.builtin.copy:
        src: booking_svc_v2_service.file
        dest: /etc/systemd/system/fdfs-booking-service.service
    
      notify: start the booking svc
    
    - name: Make sure the booking service is running and enabled at boot
      ansible.builtin.systemd_service:
        name: fdfs-booking-service
        state: started
        enabled: true
    
    
  handlers:
    - name: Reload systemd, restart the booking service and enable it at boot
      ansible.builtin.systemd_service:
        daemon_reload: true
        enabled: true
        name: fdfs-booking-service
        state: restarted
      listen: start the booking svc