- name: Install and run the FDFS movie service
  hosts: all
  connection: local
  become: true
  vars_files:
    - secrets.yaml
  tasks:
    - name: Install system packages for the movie service (Python, venv, pip, unzip, curl, PostgreSQL client, psycopg2)
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
      - python3 
      - python3-venv 
      - python3-pip 
      - unzip 
      - curl 
      - postgresql-client
      - python3-psycopg2

    - name: Create the fdfs system user to run the service
      ansible.builtin.user:
        create_home: false
        name: fdfs
        shell: /usr/sbin/nologin
        state: present
        system: true

    - name: Create the movie service folder
      ansible.builtin.file:
        path: /opt/fdfs/movie-service
        state: directory

    
    - name: Download the movie service release (v1)
      ansible.builtin.get_url:
        url: https://fdfs-artifacts-30b67175.s3.amazonaws.com/movie-service-v1.zip
        dest: /tmp/movie-service.zip

    - name: Extract the movie service code (owned by fdfs)
      ansible.builtin.unarchive:
        remote_src: yes
        dest: /opt/fdfs/movie-service 
        src: /tmp/movie-service.zip
        owner: fdfs
        group: fdfs
      notify: restart movie svc
    
    - name: Create the virtualenv and install the Python requirements
      ansible.builtin.pip:
        virtualenv: /opt/fdfs/movie-service/venv
        virtualenv_command: python3 -m venv
        requirements: /opt/fdfs/movie-service/requirements.txt
      notify: restart movie svc
    
    - name: Make fdfs the owner of the movie service folder
      ansible.builtin.file:
        owner: fdfs
        path: /opt/fdfs/movie-service
        recurse: yes
        state: directory
    
    
    - name: Create the /etc/fdfs config folder
      ansible.builtin.file:
        path: /etc/fdfs
        state: directory

    - name: Copy the movie service env file
      ansible.builtin.copy:
        src: movie_svc_v2_env.file
        dest: /etc/fdfs/movie-service.env
        mode: '0600'
      notify: restart movie svc


    - name: Check whether the movies table already exists
      community.postgresql.postgresql_query:
        login_db: fdfs
        login_host: localhost
        login_password: FdfsPass123
        login_user: fdfs
        query: "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'movies'"
      register: movies_table

    - name: Show the movies table check result
      ansible.builtin.debug:
        var: movies_table

    - name: Load the database schema (only if the movies table is missing)
      community.postgresql.postgresql_db:
        login_host: localhost
        login_password: FdfsPass123
        login_user: fdfs
        name: fdfs
        state: restore
        target: /opt/fdfs/movie-service/db/schema.sql
      when: movies_table.rowcount == 0
      notify: restart movie svc

    - name: Count the movies already in the table
      community.postgresql.postgresql_query:
        login_db: fdfs
        login_host: localhost
        login_password: FdfsPass123
        login_user: fdfs
        query: "SELECT count(*) AS total FROM movies"
      register: movie_rows

    
    - name: Show the movie count
      ansible.builtin.debug:
        var: movie_rows


    - name: Load the sample movies (only if the table is empty)
      community.postgresql.postgresql_db:
        login_host: localhost
        login_password: FdfsPass123
        login_user: fdfs
        name: fdfs
        state: restore
        target: /opt/fdfs/movie-service/db/seed.sql
      when: movie_rows.query_result[0].total == 0
      notify: restart movie svc


    - name: Install the systemd unit file for the movie service
      ansible.builtin.template:
        src: movie_svc_v2_service.j2
        dest: /etc/systemd/system/fdfs-movie-service.service
      notify: restart movie svc

    - name: Make sure the movie service is running and enabled at boot
      ansible.builtin.systemd_service:
        name: fdfs-movie-service
        state: started
        enabled: true

  handlers:
    - name: Reload systemd, restart the movie service and enable it at boot
      ansible.builtin.systemd_service:
        daemon_reload: true
        enabled: true
        name: fdfs-movie-service
        state: restarted
      listen: restart movie svc