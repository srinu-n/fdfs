- name: Install and run the FDFS notification service
  hosts: all
  connection: local
  become: true
  vars_files:
    - secrets.yaml
  tasks:
    - name: Install system packages for the notification service (Python, venv, pip, unzip, curl, PostgreSQL client, psycopg2)
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
      - python3
      - python3-venv
      - python3-pip
      - unzip
      - curl
      - postgresql-client
      - python3-psycopg2

    - name: Create the fdfs system user to run the service
      ansible.builtin.user:
        create_home: false
        name: fdfs
        shell: /usr/sbin/nologin
        state: present
        system: true

    - name: Create the notification service folder
      ansible.builtin.file:
        path: /opt/fdfs/notification-service
        state: directory

    - name: Download the notification service release (v1)
      ansible.builtin.get_url:
        url: https://fdfs-artifacts-30b67175.s3.amazonaws.com/notification-service-v1.zip
        dest: /tmp/notification-service.zip

    - name: Extract the notification service code (owned by fdfs)
      ansible.builtin.unarchive:
        remote_src: yes
        dest: /opt/fdfs/notification-service
        src: /tmp/notification-service.zip
        owner: fdfs
        group: fdfs
      notify: restart notification svc

    - name: Create the virtualenv and install the Python requirements
      ansible.builtin.pip:
        virtualenv: /opt/fdfs/notification-service/venv
        virtualenv_command: python3 -m venv
        requirements: /opt/fdfs/notification-service/requirements.txt
      notify: restart notification svc

    - name: Make fdfs the owner of the notification service folder
      ansible.builtin.file:
        owner: fdfs
        path: /opt/fdfs/notification-service
        recurse: yes
        state: directory

    - name: Create the /etc/fdfs config folder
      ansible.builtin.file:
        path: /etc/fdfs
        state: directory

    - name: Copy the notification service env file
      ansible.builtin.template:
        src: notification_v2_env.j2
        dest: /etc/fdfs/notification-service.env
        mode: '0600'
      notify: restart notification svc

    - name: Check whether the notifications table already exists
      community.postgresql.postgresql_query:
        login_db: "{{ DB_NAME }}"
        login_host: "{{ DB_HOST }}"
        login_password: "{{ DB_PASSWORD }}"
        login_user: "{{ DB_USER }}"
        query: "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'notifications'"
      register: notifications_table

    - name: Load the notifications schema (only if the notifications table is missing)
      community.postgresql.postgresql_db:
        login_host: "{{ DB_HOST }}"
        login_password: "{{ DB_PASSWORD }}"
        login_user: "{{ DB_USER }}"
        name: "{{ DB_NAME }}"
        state: restore
        target: /opt/fdfs/notification-service/db/schema.sql
      when: notifications_table.rowcount == 0
      notify: restart notification svc

    - name: Install the systemd unit file for the notification service
      ansible.builtin.copy:
        src: notification_svc_v2_service.file
        dest: /etc/systemd/system/fdfs-notification-service.service
      notify: restart notification svc

    - name: Make sure the notification service is running and enabled at boot
      ansible.builtin.systemd_service:
        name: fdfs-notification-service
        state: started
        enabled: true

  handlers:
    - name: Reload systemd, restart the notification service and enable it at boot
      ansible.builtin.systemd_service:
        daemon_reload: true
        enabled: true
        name: fdfs-notification-service
        state: restarted
      listen: restart notification svc