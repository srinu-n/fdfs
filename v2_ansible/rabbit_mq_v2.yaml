- name: Install and configure RabbitMQ for FDFS
  hosts: all
  become: true
  connection: local
  vars_files:
    - secrets.yaml
  tasks:
    - name: Update the apt cache and install rabbitmq-server
      ansible.builtin.apt:
        name: rabbitmq-server
        state: present
        update_cache: true

    - name: Start RabbitMQ and enable it at boot
      ansible.builtin.systemd_service:
        name: rabbitmq-server
        enabled: true
        state: started

    - name: Create the fdfs RabbitMQ user with full permissions on /
      community.rabbitmq.rabbitmq_user:
        user: "{{ RABBITMQ_USER }}"
        password: "{{ RABBITMQ_PASSWORD }}"
        update_password: always
        state: present
        permissions:
          - vhost: /
            configure_priv: ".*"
            read_priv: ".*"
            write_priv: ".*"
        tags: administrator

    - name: Enable the RabbitMQ management UI (port 15672)
      community.rabbitmq.rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled